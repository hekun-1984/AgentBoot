# 糖尿病案例使用的模型表。
# set AGENTBOOT_MODELS=examples/diabetes/models.yaml
# 风险评估 Agent 使用 reason，其余对话 Agent 使用 general。
# 指南检索在配置了 embed、rerank 时改走向量和精排。

route:
  default: fast-a
  options:
    - name: fast-a
      provider: openai
      model: gpt-4.1-mini
      api_key_env: OPENAI_API_KEY
    - name: fast-b
      provider: dashscope
      model: qwen-turbo
      api_key_env: DASHSCOPE_API_KEY

general:
  options:
    - name: main
      provider: openai
      model: gpt-4.1
      api_key_env: OPENAI_API_KEY

reason:
  default: deep
  options:
    - name: deep
      provider: openai
      model: gpt-4.1
      api_key_env: OPENAI_API_KEY
    - name: deep-backup
      provider: dashscope
      model: qwen-max
      api_key_env: DASHSCOPE_API_KEY

embed:
  options:
    - name: vectors
      provider: openai
      model: text-embedding-3-small
      api_key_env: OPENAI_API_KEY

rerank:
  options:
    - name: ranker
      provider: cohere
      model: rerank-v3.5
      api_key_env: COHERE_API_KEY
