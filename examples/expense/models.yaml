# 费用审批案例使用的模型表。
# set AGENTBOOT_MODELS=examples/expense/models.yaml
# 限额判断 Agent 使用 reason，读单和登记使用 general。
# 制度原文在配置了 rerank 时按问题重排条款，不改限额文字。
# 自建服务与云上模型填法相同，用 base_url 指向自己的地址。本地不校验密钥时，LOCAL_API_KEY 设成占位值。

route:
  default: local-route
  options:
    - name: local-route
      provider: ollama
      model: qwen2.5:7b
      base_url: http://127.0.0.1:11434
    - name: fast-a
      provider: openai
      model: gpt-4.1-mini
      api_key_env: OPENAI_API_KEY

general:
  default: local
  options:
    - name: local
      provider: openai
      model: qwen2.5-32b
      base_url: http://10.0.0.8:8000/v1
      api_key_env: LOCAL_API_KEY
    - name: main
      provider: openai
      model: gpt-4.1
      api_key_env: OPENAI_API_KEY

reason:
  default: local-deep
  options:
    - name: local-deep
      provider: openai
      model: qwen2.5-72b
      base_url: http://10.0.0.8:8000/v1
      api_key_env: LOCAL_API_KEY
    - name: deep
      provider: openai
      model: gpt-4.1
      api_key_env: OPENAI_API_KEY

rerank:
  options:
    - name: ranker
      provider: cohere
      model: rerank-v3.5
      api_key_env: COHERE_API_KEY
